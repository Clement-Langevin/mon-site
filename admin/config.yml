backend:
  name: github
  repo: Clement-Langevin/mon-site
  branch: main
  base_url: https://decap-oauth.clement-langevin73.workers.dev
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projets"
    label: "Projets"
    files:
      - name: "projets"
        label: "Mes projets"
        file: "projets.json"
        fields:
          - label: "Projets"
            name: "projets"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Médias (photos / vidéos)"
                name: "medias"
                widget: "list"
                field: { label: "Fichier", name: "fichier", widget: "file" }
